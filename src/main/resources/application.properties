# Spring Profile Active Setting
spring.profiles.active=local

# Application Service Configurations
spring.application.name=ScaleStore
server.port=8080

# Production Relational Database Routing (Render Context Injection)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA and Serialization Architecture Rules
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Cache Abstraction Layer Rule Engine
spring.cache.type=redis