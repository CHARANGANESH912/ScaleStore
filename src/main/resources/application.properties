# ===================================================================
# Local In-Memory Database Configuration (Bypasses Render Network)
# ===================================================================
spring.datasource.url=jdbc:h2:mem:scalestore;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Force Hibernate to use H2 Dialect automatically
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Enables a visual database console at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.settings.web-allow-others=true

