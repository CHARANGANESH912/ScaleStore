<!DOCTYPE html>
<html>
<head>
    <title>ScaleStore - Dashboard</title>
    <style>
        body { font-family: sans-serif; margin: 40px; background: #f4f4f4; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .product-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        button { background: #007bff; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        input { padding: 8px; margin: 5px 0; width: 100%; box-sizing: border-box; }
        .title-container { display: flex; align-items: center; gap: 12px; color: #222; margin-bottom: 30px; }
        .logo-badge { background: #007bff; color: white; padding: 4px 12px; border-radius: 8px; font-weight: bold; font-family: monospace; font-size: 28px; }
    </style>
</head>
<body>

<div class="title-container">
    <span class="logo-badge">SS</span>
    <h1 style="margin: 0; font-size: 32px;">ScaleStore Dashboard</h1>
</div>

<div id="auth-section" class="card">
    <h3>Login</h3>
    <input type="text" id="email" placeholder="Email (test@example.com)">
    <input type="password" id="password" placeholder="Password">
    <button onclick="login()">Login & Get Token</button>
    <p id="auth-status"></p>
</div>

<div id="store-section" style="display:none;">
    <h2>Product Catalog</h2>
    <div id="products" class="product-list"></div>
</div>

<script>
    async function login() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        const response = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
        });

        if (response.ok) {
            document.getElementById('auth-status').innerText = "✅ Logged In!";
            document.getElementById('auth-section').style.display = "none";
            document.getElementById('store-section').style.display = "block";
            loadProducts();
        } else {
            alert("Login Failed!");
        }
    }

    async function loadProducts() {
        // Clean request parameters to match our fully open Security Config paths
        const response = await fetch('/api/products');

        if (response.ok) {
            const products = await response.json();
            const container = document.getElementById('products');
            container.innerHTML = "";

            products.forEach(p => {
                container.innerHTML += `
                    <div class="card">
                        <h3>${p.name}</h3>
                        <p>${p.description}</p>
                        <p><strong>Price: $${p.price}</strong></p>
                        <p>Stock: ${p.stock}</p>
                        <button onclick="purchase(${p.id})">Buy Now</button>
                    </div>
                `;
            });
        } else {
            console.error("Failed to load products, status: " + response.status);
            alert("Failed to load products!");
        }
    }

    async function purchase(id) {
        // Clean purchase execution matching your query-param backend setup
        const response = await fetch(`/api/products/${id}/purchase?quantity=1`, {
            method: 'POST'
        });
        if (response.ok) {
            alert("Purchase Successful!");
            loadProducts(); // Automatically updates stock dynamically across the grid
        } else {
            alert("Purchase Failed!");
        }
    }
</script>
</body>
</html>
