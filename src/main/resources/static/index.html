<!DOCTYPE html>
<html>
<head>
    <title>ScaleStore - Dashboard</title>
    <style>
        body { font-family: sans-serif; margin: 40px; background: #f4f4f4; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .product-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        button { background: #007bff; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        input { padding: 8px; margin: 5px 0; width: 100%; box-sizing: border-box; }
        .title-container { display: flex; align-items: center; gap: 12px; color: #222; margin-bottom: 30px; }
    </style>
</head>
<body>

<div class="title-container">
    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#007bff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4.5 16.5c-1.5 1.26-2.5 3.19-2.5 5.5s1 4.24 2.5 5.5"/>
        <path d="M12 2C6.5 2 2 6.5 2 12c0 3.58 2 6.5 4.5 8l4.5-4 1-5 5-1 4-4.5c-1.5-2.5-4.42-4.5-8-4.5z"/>
        <path d="M14.5 9.5a1 1 0 1 0 0-2 1 1 0 0 0 0 2z"/>
        <path d="M16 16c.5-1.5 2.5-2.5 4.5-2.5s4 1 4.5 2.5c0 .5-1.5 1.5-4.5 1.5s-4-1-4.5-1.5z"/>
    </svg>
    <h1 style="margin: 0;">ScaleStore Dashboard</h1>
</div>

<div id="auth-section" class="card">
    <h3>Login</h3>
    <input type="text" id="email" placeholder="Email (student@bvrit.edu.in)">
    <input type="password" id="password" placeholder="Password">
    <button onclick="login()">Login & Get Token</button>
    <p id="auth-status"></p>
</div>

<div id="store-section" style="display:none;">
    <h2>Product Catalog</h2>
    <div id="products" class="product-list"></div>
</div>

<script>
    let jwtToken = "";

    async function login() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        const response = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
        });

        if (response.ok) {
            let rawToken = await response.text();

            // Handle token parsing safely if wrapped in quotes or nested inside JSON keys
            try {
                const parsed = JSON.parse(rawToken);
                rawToken = parsed.token || rawToken;
            } catch (e) {
                // Remove literal wrapping quotation marks if present from plain text response
                rawToken = rawToken.replace(/^"|"$/g, '');
            }

            // Standardize token with Bearer prefix for Spring Security filter parsing
            jwtToken = rawToken.startsWith('Bearer ') ? rawToken : `Bearer ${rawToken}`;

            document.getElementById('auth-status').innerText = "✅ Logged In!";
            document.getElementById('auth-section').style.display = "none";
            document.getElementById('store-section').style.display = "block";
            loadProducts();
        } else {
            alert("Login Failed!");
        }
    }

    async function loadProducts() {
        const response = await fetch('/api/products', {
            headers: { 'Authorization': jwtToken }
        });

        if (response.ok) {
            const products = await response.json();
            const container = document.getElementById('products');
            container.innerHTML = "";

            products.forEach(p => {
                container.innerHTML += `
                    <div class="card">
                        <h3>${p.name}</h3>
                        <p>${p.description}</p>
                        <p><strong>Price: $${p.price}</strong></p>
                        <p>Stock: ${p.stock}</p>
                        <button onclick="purchase(${p.id})">Buy Now</button>
                    </div>
                `;
            });
        } else {
            console.error("Failed to load products, status: " + response.status);
            alert("Failed to load products! Check browser logs for security parameter mismatches.");
        }
    }

    async function purchase(id) {
        const response = await fetch(`/api/products/${id}/purchase?quantity=1`, {
            method: 'POST',
            headers: { 'Authorization': jwtToken }
        });
        if (response.ok) {
            alert("Purchase Successful!");
            loadProducts(); // Re-trigger GET mapping to refresh live inventory stock counters
        } else {
            alert("Purchase Failed!");
        }
    }
</script>
</body>
</html>
